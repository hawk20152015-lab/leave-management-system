name: Build APK - Auto Detect Path

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Detect buildozer location
      run: |
        echo "🔍 Step 1: Detecting buildozer.spec location..."
        BUILDOZER_PATH=$(find . -name "buildozer.spec" -type f | head -1)
        
        if [ -z "$BUILDOZER_PATH" ]; then
          echo "❌ ERROR: buildozer.spec not found anywhere!"
          echo ""
          echo "Files in current directory:"
          ls -la
          echo ""
          echo "Searching for Python files:"
          find . -name "*.py" -type f | head -10
          exit 1
        fi
        
        echo "✅ Found: $BUILDOZER_PATH"
        BUILDOZER_DIR=$(dirname "$BUILDOZER_PATH")
        echo "📁 Working directory will be: $BUILDOZER_DIR"
        
        if [ "$BUILDOZER_DIR" = "." ]; then
          echo "📌 buildozer.spec is in root directory"
          echo "BUILDOZER_NEEDS_CD=false" >> $GITHUB_ENV
        else
          echo "📌 buildozer.spec is in subdirectory"
          echo "BUILDOZER_NEEDS_CD=true" >> $GITHUB_ENV
          echo "BUILDOZER_DIR=$BUILDOZER_DIR" >> $GITHUB_ENV
        fi
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        echo "📦 Installing Python packages..."
        pip install --upgrade pip
        pip install buildozer cython kivy
        echo "✅ Dependencies installed"
    
    - name: Install system dependencies
      run: |
        echo "🔧 Installing system packages..."
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          libtool \
          autoconf \
          automake \
          pkg-config \
          libncurses5-dev \
          libffi-dev \
          libssl-dev \
          zlib1g-dev
        echo "✅ System packages installed"
    
    - name: Build APK
      run: |
        echo "🔨 Starting APK build..."
        
        if [ "${{ env.BUILDOZER_NEEDS_CD }}" = "true" ]; then
          echo "📁 Changing to directory: ${{ env.BUILDOZER_DIR }}"
          cd "${{ env.BUILDOZER_DIR }}"
        fi
        
        echo "📍 Current directory: $(pwd)"
        echo "📋 Files in current directory:"
        ls -la
        
        echo ""
        echo "🏗️ Building APK..."
        buildozer -u android debug
        
        echo "✅ Build completed!"
    
    - name: Verify APK
      if: always()
      run: |
        echo "📦 Checking for APK files..."
        find . -name "*.apk" -type f
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: leave-management-apk
        path: |
          **/bin/*.apk
          bin/*.apk
        retention-days: 30
        if-no-files-found: warn
    
    - name: Build status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ APK build SUCCESSFUL!"
          echo "📦 APK files available in Artifacts"
        else
          echo "❌ APK build FAILED!"
          echo "📋 Check logs above for errors"
        fi
